name: ci

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Install foundry
              uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
              with:
                  version: nightly-c99854277c346fa6de7a8f9837230b36fd85850e

            - name: Run foundry build
              run: |
                  forge --version
                  forge build
              id: build

    lint-check:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
              with:
                  version: nightly-c99854277c346fa6de7a8f9837230b36fd85850e

            - name: Run foundry fmt check
              run: |
                  forge fmt --check
              id: fmt

    test:
        runs-on: ubuntu-latest
        needs: lint-check
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
              with:
                  version: nightly-c99854277c346fa6de7a8f9837230b36fd85850e
            - name: Run foundry tests
              # --ast tests enables inline configs to work https://github.com/foundry-rs/foundry/issues/7310#issuecomment-1978088200
              run: |
                  forge test -vv --gas-report --ast 
              id: test

    overrides:
        runs-on: ubuntu-latest
        needs: lint-check
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
              with:
                  version: nightly-c99854277c346fa6de7a8f9837230b36fd85850e
            - name: Run foundry overrides test mode
              # --ast tests enables inline configs to work https://github.com/foundry-rs/foundry/issues/7310#issuecomment-1978088200
              run: |
                  DEPLOY_OVERRIDES=true forge test -vv --gas-report --ast 
              id: overrides

    coverage:
        runs-on: ubuntu-latest
        needs: lint-check
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
              with:
                  version: nightly-c99854277c346fa6de7a8f9837230b36fd85850e
            - name: Run foundry coverage
              run: |
                  FOUNDRY_PROFILE=coverage forge coverage --report summary
              id: coverage
